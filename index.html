<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookly — Back office</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <!-- Shown until the app mounts. -->
    <div id="loading-bg">
      <div class="loading-logo">
        <svg width="56" height="56" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Bookly">
          <rect width="30" height="30" rx="8" fill="var(--initial-loader-color)" />
          <path
            d="M10 7.5h6.1c3.2 0 5.1 1.6 5.1 4.1 0 1.6-.8 2.8-2.2 3.4 1.9.5 3 1.9 3 3.8 0 2.8-2.1 4.7-5.6 4.7H10V7.5Zm3.2 2.7v4h2.6c1.5 0 2.3-.7 2.3-2s-.8-2-2.3-2h-2.6Zm0 6.5v4.6h3c1.7 0 2.6-.8 2.6-2.3s-.9-2.3-2.6-2.3h-3Z"
            fill="#fff" />
        </svg>
      </div>
      <div class="loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Startup loader colours; follows the OS dark mode so there's no white flash.
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches

    document.documentElement.style.setProperty('--initial-loader-bg', dark ? '#232333' : '#F5F5F9')
    document.documentElement.style.setProperty('--initial-loader-color', '#696CFF')
  </script>
</body>

</html>
